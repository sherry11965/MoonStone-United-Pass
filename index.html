 Description: Vite SPA entry document (P1 Nuxt → Vite migration).
              Head attributes mirror nuxt.config.ts `app.head`
              (htmlAttrs lang=zh-CN, title "United Pass", charset, viewport).
              The inline script is the literal expansion of
              shared/theme.ts `THEME_INITIALIZATION_SCRIPT` (anti-flash theme
              bootstrap, runs before first paint).
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>United Pass</title>
    <script>
      (function () {
        var resolvedTheme = "light";
        try {
          var storedTheme = localStorage.getItem("united-pass-color-theme");
          resolvedTheme = storedTheme === "light" || storedTheme === "dark"
            ? storedTheme
            : window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        } catch (error) {
          resolvedTheme = "light";
        }
        document.documentElement.setAttribute("data-theme", resolvedTheme);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
